name:                wai-transformers
version:             0.2.0
github:              "athanclark/wai-transformers"
license:             BSD3
author:              "Athan Clark"
maintainer:          "aclark@araliasoftware.com"
copyright:           "2025 Athan Clark"
category:            Web
synopsis:            Monad transformers for WAI and WebSockets

ghc-options: -Wall

extra-source-files:
- README.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on Github at <https://github.com/athanclark/wai-transformers#readme>

dependencies:
- base >= 4.8 && < 5
- exceptions
- unliftio-core
- wai >= 3.2.1
- wai-websockets
- transformers
- websockets >= 0.12.4

library:
  source-dirs: src
